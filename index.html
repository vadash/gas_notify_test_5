function draw() {
  const cols = colsNow();
  let head = '<th class="stn">Станция</th>' +
    dayDivided(cols, c => `<th scope="col">${c.h}</th>`, '<th class="day-div">завтра</th>');
  document.getElementById("cols").innerHTML = head;
  const order = T.stations
    // «Сейчас» sorts on the arrival-hour cell alone; over a selected run
    // the displayed cells average (0 when the run is empty)
    .map(st => ({ st, m: nowMode && span.length ? cellVal(st, span[0])
      : cols.length ? cols.reduce((a, c) => a + cellVal(st, c), 0) / cols.length : 0 }))
    .sort((a, b) => b.m - a.m);

}
// The page's now view: the whole forecast span, ranked by the cell at
// the arrival hour (the open time clamped to the nearest tabled hour).
function applyNow() {
  rebuildSpan();
  nowMode = true;
  presetBand = null;
  winLo = 0;
  winHi = Math.max(0, spanSteps - 1);
  draw();
}
// A preset selects its band's remainder from the arrival hour when the open
// time lies inside the band, otherwise the band's next occurrence in the
// span (never both days at once).
function applyPreset(fromH, toH) {
  nowMode = false;
  presetBand = [fromH, toH];
  selectBand(fromH, toH);
}
function selectBand(fromH, toH) {
  const inBand = c => c.h >= fromH && c.h < toH;
  let pick = span.filter(c => inBand(c) && c.d === (span[0] ?? {}).d);
  if (!pick.length) pick = span.filter(inBand);
  if (!pick.length) { winLo = 1; winHi = 0; draw(); return; }
  winLo = pick[0].disp;
  winHi = pick[pick.length - 1].disp;

}

  b.onclick = () => b.hasAttribute("data-now")
    ? applyNow()
    : applyPreset(+b.dataset.from, +b.dataset.to);
}
// Board entries re-age against the wall clock at each render, telegram-style:
// the age is the time since the read plus the source report's own age.
function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  return (m10 === 1 && m100 !== 11) ? one
    : (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) ? few : many;
}
function ageBoard() {
  for (const el of document.querySelectorAll(".board-entry")) {
    const age = (Date.now() - Date.parse(el.dataset.at)) / 60000 + (+el.dataset.age || 0);
    const m = Math.max(0, Math.round(age));
    const h = Math.round(m / 60);
    el.querySelector(".board-age").textContent =
      m < 60 ? `Обновлено ~${m} мин назад`
             : `Обновлено ~${h} ${plural(h, "час", "часа", "часов")} назад`;
  }
}
// The rendered snapshot: its payload feeds the table, its server-rendered
// board and banner fill the slots. One call per copy, no document reload.
// «Сейчас» always re-derives the whole forecast span from the clock; an
// active named preset re-selects its band in the new span, so a fresher
// copy never keeps the stale window's step range.
function applySnapshot(snap) {
  const first = renderedHash === null;
  T = snap.data;
  renderedHash = snap.payloadHash;
  document.getElementById("banner-slot").innerHTML = T.bannerHtml;
  document.getElementById("board-slot").innerHTML = T.boardHtml;
  ageBoard();
  if (first || (nowMode && presetBand === null)) applyNow();
  else if (presetBand !== null) { rebuildSpan(); selectBand(...presetBand); }
  else { rebuildSpan(); draw(); }
}
// Install banner: Android gets a one-tap install via the captured
// beforeinstallprompt event, iOS gets manual home-screen steps; the
// standalone (installed) view never asks, and a dismissal is remembered
// for 14 days.
(function () {
  const bar = document.getElementById("install");
  if (!bar || matchMedia("(display-mode: standalone)").matches) return;
  const KEY = "installDismissedAt";
  if (+(localStorage.getItem(KEY) || 0) > Date.now() - 14 * 864e5) return;
  const ua = navigator.userAgent;
  const ios = /iPhone|iPad|iPod/.test(ua)
    || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const yes = document.getElementById("install-yes");
  const no = document.getElementById("install-no");
  const dismiss = () => {
    localStorage.setItem(KEY, String(Date.now()));
    bar.hidden = true;
  };
  no.onclick = dismiss;
  if (ios) {
    document.getElementById("install-android").hidden = true;
    document.getElementById("install-ios").hidden = false;
    yes.hidden = true;
    no.textContent = "Понятно";
    bar.hidden = false;
    return;
  }
  // Desktop keeps the omnibar install affordance; no banner there.
  if (!matchMedia("(pointer: coarse)").matches && !/Mobi|Android/.test(ua)) return;
  let deferred = null;
  addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferred = e;
    document.getElementById("install-android").hidden = false;
    document.getElementById("install-ios").hidden = true;
    bar.hidden = false;
  });
  addEventListener("appinstalled", () => {
    deferred = null;
    localStorage.removeItem(KEY);
    bar.hidden = true;
  });
  yes.onclick = async () => {
    if (!deferred) return;
    bar.hidden = true;
    deferred.prompt();
    await deferred.userChoice;
    deferred = null;
  };
})();
// Background refresh: fetch the published snapshot on open, when the tab

// view; the document never reloads. An unknown schema or an older copy
// keeps the rendered one. The raw CDN may serve a snapshot up to five
// minutes old; the payload comparison absorbs that, so the fetch is a plain
async function refresh() {
  if (!SNAPSHOT_URL) return;
  try {
    const res = await fetch(SNAPSHOT_URL, { cache: "no-cache" });
    if (!res.ok) return;
    const snap = await res.json();
    // Unknown schema: a payload this build cannot read; keep the copy held.
    if (!snap || snap.schemaVersion !== 1) return;
    if (snap.payloadHash !== renderedHash) {
      applySnapshot(snap);
    }
  } catch (e) {
    // offline: keep the rendered copy
  }
}
addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") refresh();
});
addEventListener("online", refresh);
setInterval(() => {
  if (document.visibilityState === "visible") refresh();
}, 600000);
applySnapshot(SNAPSHOT);
refresh();
if ("serviceWorker" in navigator) {
  // offline view: after the first visit the last published page opens
  // without network and refreshes in the background when online
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
